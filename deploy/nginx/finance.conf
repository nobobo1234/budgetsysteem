# Server-blok voor de bestaande nginx op de VPS (spec: Achter je bestaande nginx).
# Vervang finance.mijndomein.nl door het echte domein. TLS via certbot.

limit_req_zone $binary_remote_addr zone=budget_login:10m rate=10r/m;
# nginx kent alleen r/s en r/m. 1r/m is de grove eerste rem; de app houdt zelf precies
# 30 uploads per uur bij (fase 3).
limit_req_zone $binary_remote_addr zone=budget_ingest:10m rate=1r/m;

# Onbekende hostnamen (scanners op IP) direct afkappen
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name finance.mijndomein.nl;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name finance.mijndomein.nl;

    ssl_certificate     /etc/letsencrypt/live/finance.mijndomein.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.mijndomein.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # De CSP komt uit SvelteKit, niet dubbel uit nginx

    client_max_body_size 12m;

    # Compressie in nginx in plaats van in Node
    gzip on;
    # De app stuurt .js als text/javascript; zonder dat type blijft de JS ongecomprimeerd
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # nginx zet deze headers zelf en overschrijft wat de client meestuurt;
    # alleen daardoor is ADDRESS_HEADER=x-real-ip in de app veilig
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /login {
        limit_req zone=budget_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/auth/ {
        limit_req zone=budget_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Alleen de import mag groter zijn (bestanden tot 20 MB)
    location = /import {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:3000;
    }

    # Upload-endpoint voor het deelmenu (fase 3)
    location = /api/ingest {
        limit_req zone=budget_ingest burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
}
