name: CodeQL

# Code scanning naast Semgrep in ci.yml. Als eigen workflow (advanced setup) in plaats van de
# default setup, zodat pinning, tokenrechten en timeouts net zo streng zijn als elders, en zodat
# OpenSSF Scorecard de SAST-stap herkent (Semgrep via docker telt daar niet mee).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
