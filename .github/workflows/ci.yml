name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Elke job heeft een timeout van ruim twee keer de normale duur. Zonder timeout geldt de standaard
# van 6 uur, en een hangende download (zoals apt in `playwright install --with-deps`) kost dan de
# hele tijd Actions-minuten.
jobs:
  # Alleen docs (docs/ of een .md in de root) gewijzigd? Dan slaan de zware jobs en stappen over.
  # Overgeslagen jobs tellen als geslaagd voor de verplichte checks; faalt deze job of is het niet
  # zeker, dan draait alles.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Merge-commit van de PR: de eerste ouder is de base-branch
            from=HEAD^1
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            from=$BEFORE
          else
            # Nieuwe branch of onbekende vorige stand
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$from" HEAD)
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Eqv '^(docs/.*|[^/]+\.md)$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # Elke push: lint, typecheck, unit-tests en de repo-controles
  static:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - if: needs.changes.outputs.code != 'false'
        run: pnpm check
      - if: needs.changes.outputs.code != 'false'
        run: pnpm test:unit --coverage
      - name: Coverage in de samenvatting
        if: needs.changes.outputs.code != 'false'
        run: node scripts/coverage-summary.mjs
      - name: Onzichtbare tekens
        run: pnpm check:invisible
      - name: Geen echte IBANs
        run: pnpm check:ibans

  integration:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Bevat ook het performance-budget (eerste JS-bundel < 100 kB gzip)
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Performance-budget met Lighthouse (budget in scripts/lighthouse.mjs): loginpagina en
  # startscherm met een testsessie; eerste JS-bundel < 100 kB gzip, TBT, LCP en CLS. Rapporten
  # alleen als artifact, nooit naar publieke opslag.
  lighthouse:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chrome staat al op de runner
      - run: pnpm lighthouse
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/rapporten/
          retention-days: 7

  # Afspraken voor AI-gegenereerde code: geen verwijderde tests, geen dalende asserties,
  # geen onzichtbare tekens in commitberichten
  guardrails:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tests en asserties
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-test-count.mjs
      - name: Onzichtbare tekens in commits
        env:
          COMMIT_RANGE: origin/${{ github.base_ref }}..HEAD
        run: node scripts/check-invisible-chars.mjs --commits

  security:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Dependency-audit
        if: needs.changes.outputs.code != 'false'
        run: pnpm audit --prod --audit-level high
      # Images op digest; Dependabot houdt Docker-images in workflows niet bij, dus handmatig bijwerken
      - name: Geheimen (gitleaks v8.30.1)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner
      - name: Statische analyse (Semgrep CE 1.181.0)
        if: needs.changes.outputs.code != 'false'
        run: |
          docker run --rm -v "$PWD:/src" \
            semgrep/semgrep@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b \
            semgrep scan --config p/default --config p/typescript --error --metrics off
      - name: Workflows (zizmor)
        if: needs.changes.outputs.code != 'false'
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
      # Naast zizmor: syntax, expressies en shellcheck op de run-blokken
      - name: Workflows (actionlint 1.7.12)
        if: needs.changes.outputs.code != 'false'
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  docker:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    # De VPS is arm64; native bouwen op een arm64-runner in plaats van via QEMU-emulatie
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Lagen-cache in de scope van de PR, voor volgende pushes. Dit image wordt nooit uitgerold;
      # de deploy bouwt bewust zonder cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: budget:ci
          # Neutrale origin: dit image rolt nooit uit, en CI kent de productie-origin niet
          build-args: ORIGIN=https://budget.example.test
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Image-scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: budget:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: budget:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true

  # Eén verplichte check in de ruleset in plaats van elke job los: een job hernoemen of toevoegen
  # breekt de ruleset dan niet. Overgeslagen jobs (alleen docs, of push in plaats van PR) tellen
  # als geslaagd; mislukt of geannuleerd niet. Lighthouse stond niet in de verplichte checks van
  # de ruleset en telt hier dus ook niet mee.
  ci-ok:
    if: always()
    needs: [changes, static, integration, e2e, guardrails, security, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultaten: $RESULTS"
          case " $RESULTS " in
            *' failure '* | *' cancelled '*) exit 1 ;;
          esac

  # Uitrol (docs/DEPLOY.md): na een groene push op main krijgt de privé ops-repo een
  # workflow_dispatch met deze commit. De ops-repo controleert zelf dat de commit op main staat,
  # bouwt en rolt uit; deze repo heeft geen toegang tot de VPS, de registry of de origin.
  # Alleen in de echte publieke repo: in een fork of de oude privé-repo slaat deze job over.
  dispatch-deploy:
    needs: [changes, static]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'nobobo1234/budgetsysteem' && github.event.repository.private == false &&
      needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Alleen vanaf main; het token mag alleen workflows starten in die ene ops-repo
    environment: ops-dispatch
    permissions: {}
    steps:
      - name: Ops-repo starten
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
          OPS_REPO: ${{ secrets.OPS_REPO }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST "repos/${OPS_REPO}/actions/workflows/deploy.yml/dispatches" \
            -f ref=main -f "inputs[sha]=${SHA}" --silent
